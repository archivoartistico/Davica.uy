<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Galería Davica</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body class="bg-azul-claro min-h-screen text-azul-profundo">

    <div id="login-container" class="flex items-center justify-center min-h-screen px-4">
        <div class="bg-white p-8 rounded-lg shadow-xl max-w-md w-full border border-blue-100">
            <div class="text-center mb-6">
                <h1 class="font-serif text-2xl font-bold text-azul-oscuro">Galería Davica</h1>
                <p class="text-gray-500 text-sm mt-1">Panel de Administración</p>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-azul-medio focus:border-transparent outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-azul-medio focus:border-transparent outline-none">
                </div>
                
                <div id="login-error" class="text-red-500 text-sm hidden"></div>
                
                <button type="submit" class="w-full bg-azul-medio hover:bg-azul-hover text-white font-semibold py-2 rounded-lg transition-colors shadow-md">
                    Iniciar Sesión
                </button>
            </form>
        </div>
    </div>

    <div id="dashboard-container" class="hidden min-h-screen flex flex-col">
        <header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex justify-between items-center">
            <h1 class="font-serif text-xl font-bold text-azul-oscuro">Panel de Control</h1>
            <button id="btn-logout" class="text-gray-500 hover:text-red-600 font-medium transition-colors text-sm">
                Cerrar Sesión
            </button>
        </header>

        <div class="flex flex-grow">
            <aside class="w-64 bg-white border-r border-gray-200 p-4 space-y-2">
                <button onclick="cambiarTab('obras')" class="w-full text-left px-4 py-2 rounded-lg font-medium text-sm transition-colors hover:bg-gray-50">
                    Gestionar Obras
                </button>
                <button onclick="cambiarTab('configuracion')" class="w-full text-left px-4 py-2 rounded-lg font-medium text-sm transition-colors hover:bg-gray-50">
                    Configuración General
                </button>
            </aside>

            <main class="flex-grow p-8">
                <div id="tab-obras" class="tab-content active">
                    <h2 class="text-xl font-bold text-azul-oscuro mb-4">Mis Obras de Arte</h2>
                    <p class="text-gray-600">Aquí podrás agregar, editar y eliminar las obras del catálogo virtual.</p>
                </div>

                <div id="tab-configuracion" class="tab-content">
                    <h2 class="text-xl font-bold text-azul-oscuro mb-4">Configuración General</h2>
                    <p class="text-gray-600">Configura los datos del portafolio y enlaces principales.</p>
                </div>
            </main>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://qvlhsggnxgapwqimhflw.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2bGhzZ2dueGdhcHdxaW1oZmx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0Mjk4NDksImV4cCI6MjA5NjAwNTg0OX0.SyZ34curAuUxn3oCiGc6sLN8_zL9kpUIZqaheDNy5Tg";
        
        // CORRECCIÓN AQUÍ: Inicializamos directamente usando la constante sin redeclararla con 'const supabase ='
        supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginContainer = document.getElementById('login-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const btnLogout = document.getElementById('btn-logout');

        // Verificar Sesión
        async function verificarSesion() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                mostrarDashboard();
            } else {
                mostrarLogin();
            }
        }

        function mostrarDashboard() {
            loginContainer.classList.add('hidden');
            dashboardContainer.classList.remove('hidden');
            cargarDatosExistentes();
        }

        function mostrarLogin() {
            dashboardContainer.classList.add('hidden');
            loginContainer.classList.remove('hidden');
        }

        // Cambiar de Pestaña administrativa
        function cambiarTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        // Manejo del Formulario de Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.classList.add('hidden');
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                loginError.textContent = "Credenciales incorrectas: " + error.message;
                loginError.classList.remove('hidden');
            } else {
                mostrarDashboard();
            }
        });

        // Manejo de Logout
        btnLogout.addEventListener('click', async () => {
            await supabase.auth.signOut();
            mostrarLogin();
        });

        // --- MANEJO DE BASE DE DATOS ---
        async function cargarDatosExistentes() {
            console.log("Conectado con Supabase. Listo para descargar tablas de Obras y Configuración.");
        }

        // Evento de inicialización
        document.addEventListener("DOMContentLoaded", verificarSesion);
    </script>
</body>
</html>
