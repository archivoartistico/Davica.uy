<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Galería Davica</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-azul-claro min-h-screen text-azul-profundo">

    <div id="login-container" class="flex items-center justify-center min-h-screen px-4">
        <div class="bg-white p-8 rounded-lg shadow-xl max-w-md w-full border border-blue-100">
            <div class="text-center mb-6">
                <h1 class="font-serif text-2xl font-bold text-azul-oscuro">Galería Davica</h1>
                <p class="text-gray-500 text-sm mt-1">Panel de Administración Obras</p>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
                    <input type="email" id="login-email" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-azul-medio focus:border-transparent outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input type="password" id="login-password" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-azul-medio focus:border-transparent outline-none">
                </div>
                
                <div id="login-error" class="text-red-500 text-sm hidden bg-red-50 p-2 rounded border border-red-100"></div>
                
                <button type="submit" 
                        class="w-full bg-azul-medio hover:bg-azul-hover text-white font-semibold py-2 rounded-lg transition-colors shadow-md">
                    Iniciar Sesión
                </button>
            </form>
        </div>
    </div>

    <div id="dashboard-container" class="hidden min-h-screen flex flex-col">
        <header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <span class="font-serif text-xl font-bold text-azul-oscuro">Davica.uy</span>
                <span class="bg-blue-50 text-azul-medio text-xs font-semibold px-2.5 py-1 rounded-full">Admin Mode</span>
            </div>
            <button id="btn-logout" class="text-gray-500 hover:text-red-600 font-medium transition-colors text-sm flex items-center space-x-1">
                <i class="fas fa-sign-out-alt"></i> <span>Cerrar Sesión</span>
            </button>
        </header>

        <div class="flex flex-grow">
            <aside class="w-64 bg-white border-r border-gray-200 p-4 space-y-2">
                <button onclick="cambiarTab('tabla-obras')" id="menu-tabla-obras"
                        class="w-full text-left px-4 py-2.5 rounded-lg font-medium text-sm transition-colors bg-blue-50 text-azul-medio">
                    <i class="fas fa-paint-brush mr-2"></i> Mis Obras
                </button>
                <button onclick="cambiarTab('nueva-obra')" id="menu-nueva-obra"
                        class="w-full text-left px-4 py-2.5 rounded-lg font-medium text-sm transition-colors text-gray-600 hover:bg-gray-50">
                    <i class="fas fa-plus-circle mr-2"></i> Añadir Obra
                </button>
            </aside>

            <main class="flex-grow p-8 max-w-5xl">
                
                <div id="tab-tabla-obras" class="tab-content active space-y-6">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-bold text-azul-oscuro">Catálogo de Obras Registradas</h2>
                        <span class="text-xs text-gray-500">Sincronizado en tiempo real con Supabase</span>
                    </div>
                    
                    <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b border-gray-200 text-gray-600 font-semibold text-sm">
                                    <th class="p-4">Obra</th>
                                    <th class="p-4">Técnica</th>
                                    <th class="p-4">Año</th>
                                    <th class="p-4">Medidas</th>
                                    <th class="p-4 text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-obras-body" class="divide-y divide-gray-100 text-sm text-gray-700">
                                <tr>
                                    <td class="p-4 col-span-5 text-center text-gray-400 py-8">Cargando catálogo desde la base de datos...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="tab-nueva-obra" class="tab-content space-y-6">
                    <h2 class="text-xl font-bold text-azul-oscuro">Registrar Nueva Obra de Arte</h2>
                    
                    <form id="form-obra" class="bg-white p-6 rounded-xl shadow-md border border-gray-100 grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Título de la Obra</label>
                            <input type="text" id="obra-titulo" required class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-azul-medio">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Técnica (ej: Óleo sobre lienzo)</label>
                            <input type="text" id="obra-tecnica" required class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-azul-medio">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Año de Creación</label>
                            <input type="number" id="obra-anio" required class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-azul-medio">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Medidas (ej: 80x60 cm)</label>
                            <input type="text" id="obra-medidas" required class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-azul-medio">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Ubicación / Estado (ej: Taller, Vendida)</label>
                            <input type="text" id="obra-lugar" class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-azul-medio">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">URL de la Imagen (Supabase Bucket / Externo)</label>
                            <input type="url" id="obra-url" required class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-azul-medio">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Descripción / Concepto de la Obra</label>
                            <textarea id="obra-descripcion" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-azul-medio"></textarea>
                        </div>
                        
                        <div class="md:col-span-2 flex justify-end pt-4">
                            <button type="submit" class="bg-azul-medio hover:bg-azul-hover text-white font-semibold px-6 py-2 rounded-lg shadow transition-colors">
                                Guardar Obra en Supabase
                            </button>
                        </div>
                    </form>
                </div>

            </main>
        </div>
    </div>
